name: source-checks

on:
  push:
  pull_request:

jobs:
  dependency-free-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install compiler and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libeigen3-dev

      - name: Finite selector and runtime-checker tests
        run: bash tools/run_binding_cost_checks.sh

      - name: TRIAD-lite control-aware supervisor unit tests
        run: bash tools/run_control_aware_supervisor_unit_tests.sh

      - name: Timing-frontier replay tests
        run: python3 tools/test_replay_timing_frontier.py

      - name: Robot-module reconstruction unit tests
        run: python3 tools/test_setup_gen3_2f85_module.py

      - name: Latency-matrix verifier tests
        run: python3 tools/test_verify_latency_matrix_cell.py

      - name: Scenario-identity verifier tests
        run: python3 tools/test_verify_scenario_identity.py

      - name: Scenario override tests
        run: python3 tools/test_scenario_override_yaml.py

      - name: Documentation local-link check
        run: python3 tools/check_markdown_links.py

      - name: Documentation-claim regression guard
        run: python3 tools/check_documentation_claims.py

      - name: Python syntax check
        run: |
          python3 -m py_compile \
            tools/check_binding_cost_log.py \
            tools/check_binding_cost_source.py \
            tools/check_documentation_claims.py \
            tools/check_evidence_manifest.py \
            tools/check_global_time_plan_log.py \
            tools/check_latency_log.py \
            tools/check_markdown_links.py \
            tools/plot_results.py \
            tools/derive_cmake_install_paths.py \
            tools/replay_timing_frontier.py \
            tools/verify_latency_matrix_cell.py \
            tools/verify_scenario_identity.py \
            tools/verify_scientific_baseline.py \
            scripts/setup_gen3_2f85_module.py

      - name: Shell syntax check
        run: |
          bash -n scripts/run_scenario.sh
          bash -n scripts/reproduce_latency_matrix.sh
          bash -n tools/check_collision_hierarchy_oracle.sh
          bash -n tools/clean_stale_fsm_install.sh
          bash -n tools/run_binding_cost_checks.sh
          bash -n tools/run_binding_cost_unit_tests.sh

      - name: Verify frozen scientific baseline
        run: |
          python3 tools/verify_scientific_baseline.py \
            SCIENTIFIC_BASELINE.sha256 \
            --commit scientific-baseline

      - name: Verify source manifest
        run: sha256sum -c docs/source_sync_triad-2026-09-24.sha256

      - name: Verify frozen V1 source preserved in history
        run: bash tools/verify_frozen_v1_preserved.sh

      - name: Verify evidence package
        run: |
          cd evidence && sha256sum -c MANIFEST.sha256 && cd ..
          python3 tools/check_evidence_manifest.py

      - name: Planner core purity guard
        run: |
          python3 tools/test_check_planner_core_purity.py
          python3 tools/check_planner_core_purity.py
