# The run script appends this file after its scenario fragment; a second top-level
# movingObject mapping replaces the scenario's, so every scenario key is restated.
movingObject:
  simulatedLinearVelocity: [-0.08, 0.0, 0.0]
  giverTruthModel: independent_scripted
  perceptionLatency:
    enabled: true
    delay: 0.220
    compensate: false
configs:
  HandoverInterceptionController_ReceiverV2:
    parityTrace: true
