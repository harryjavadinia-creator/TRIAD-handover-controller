# Two-robot overlay for the TRIAD controller (HandoverInterceptionController).
#
# Robot A = the TRIAD receiver (gen3_2f85, MainRobot). Robot B = a second Kinova Gen3 ("kinova")
# that acts as the giver: it prepositions to the scenario start, waits for Robot A to begin
# observing, then presents the object along a fixed world-frame trajectory and holds.
# Robot A keeps its unchanged observe -> evaluate -> commit-once -> execute-once FSM.
#
# Append this file to $HOME/.config/mc_rtc/controllers/HandoverInterceptionController.yaml
# (run_two_robot_sim.sh does that for you). Values are the ones used in the July 2026 sessions.

robots:
  kinova:
    module: [Kinova]
    init_pos:
      translation: [1.35, 0.0, 0.0]
      rotation: [0.0, 0.0, 3.141592653589793]
  call_object:
    init_pos:
      translation: [0.92, 0.0, 0.55]
      rotation: [0.0, 1.5708, 0.0]

object:
  translation: [0.92, 0.0, 0.55]
  rpy: [0.0, 1.5708, 0.0]

movingObject:
  simulatedLinearVelocity: [-0.08, 0.0, 0.0]

dualHandover:
  enabled: true
  motionEnabled: true          # set false to let Robot B preposition and hold without presenting
  giverRobot: kinova
  giverToolFrame: tool_frame
  giverBaseFrame: base_link
  scenario: pure_x
  autoStartWithObservation: true
  allowUnvalidatedScenario: true
  referenceOnlyPreview: false
  task:
    stiffness: 36.0
    weight: 5600.0
  preposition:
    maximumLinearSpeed: 0.15
    minimumDuration: 1.0
    timeout: 30.0
    positionTolerance: 0.015
    velocityTolerance: 0.035
    stableDuration: 0.2
  terminal:
    positionTolerance: 0.015
    velocityTolerance: 0.035
    stableDuration: 0.2
    timeout: 8.0
    velocityFilterAlpha: 0.1
  safety:
    maximumLinearSpeed: 0.1
    maximumTravel: 0.5
    maximumTrackingError: 0.5
    trackingErrorGrace: 1.0
    workspaceMinLocal: [-0.2, -0.8, 0.05]
    workspaceMaxLocal: [1.0, 0.8, 1.2]
    enforceTrackingError: false
  scenarios:
    pure_x:
      objectStartWorld: [0.92, 0.0, 0.55]
      objectEndWorld: [0.55, 0.0, 0.55]
      objectVelocityWorld: [-0.08, 0.0, 0.0]
      decelerationDuration: 0.85
  carriedObject:
    enabled: true
    releaseOnReceiverAttach: true
    positionCoupledWorldOrientation: true
    referenceCoupledObject: true
    robot: call_object
    frame: call_object
    orientationRPYWorld: [0.0, 1.5708, 0.0]
    objectToGiverToolTranslation: [0.0, 0.0, 0.1556]
    objectToGiverToolRPY: [0.0, 0.0, 0.0]

# Optional states (only meaningful with dualHandover.enabled: true):
#   HandoverInterceptionController_RobotBScenarioPreview  Robot B alone executes the scenario, Robot A holds.
#   HandoverInterceptionController_StaticXTouch           deliberately simple static two-arm rendezvous.
# Select one by overriding `init:` in this file, e.g.
#   init: HandoverInterceptionController_RobotBScenarioPreview
HandoverInterceptionController_RobotBScenarioPreview: {}
HandoverInterceptionController_StaticXTouch:
  giverRobot: kinova
  giverToolFrame: tool_frame
  objectTipOffsetWorld: [-0.27, 0.0, 0.0]
  contactGap: 0.03
  giverDuration: 5.0
  receiverDuration: 5.0
  settleDwell: 0.3
  settleTimeout: 4.0
  positionTolerance: 0.008
  velocityTolerance: 0.015
  maximumGiverTravel: 0.45
  maximumReceiverTravel: 0.45
  giverStiffness: 36.0
  giverWeight: 5600.0
  receiverStiffness: 36.0
  receiverWeight: 5600.0
  logEvery: 250
