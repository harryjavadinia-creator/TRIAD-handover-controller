MainRobot: [env, /home/harry/mc_rtc_ws/Sandbox/kinova_gen3_2f85_mcdesc, gen3_2f85]
Enabled: [CALLDualRobotHandoverController]
Timestep: 0.001
IncludeHalfSitController: false

Kortex:
  allow_init_posture_gui: false
  init_posture:
    on_startup: false
    posture: [0.0, 0.4173, 3.1292, -2.1829, 0.0, 1.0342, 1.5226]

  gen3_2f85:
    ip: 192.168.1.10
    username: <kortex-username>
    password: <kortex-password>
    physical_gripper: true

  kinova:
    ip: 192.168.1.11
    username: <kortex-username>
    password: <kortex-password>
    physical_gripper: false

ignored: [env/door, env/box]
InitAttitudeFromSensor: false
InitAttitudeSensor: ""

Log: true
LogPolicy: threaded
LogDirectory: /home/harry/Downloads
LogTemplate: CALL_DUAL_ACTUAL

GUIServer:
  Enable: true
  Timestep: 0.05
  IPC: {}
  Socket: /tmp/mc_rtc
  TCP:
    Host: "*"
    Ports: [4242, 4343]

VerboseLoader: false
Plugins: []
